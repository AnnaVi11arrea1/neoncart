# Checks the live store from outside every 6 hours: pages, all old-link
# redirects, the .art forwards, certificates and the Merchant Center feed.
# A failed run makes GitHub email the repo owner. The daily Claude routine
# covers GA4 and Google Ads; its cloud sandbox can't reach the site itself.
name: Site health check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python script/site_health_check.py
